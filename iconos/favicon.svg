<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo de la luz: un contador con un rayo y el precio de cada hora (la más barata, en verde) -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3f2e3"/>
      <stop offset=".55" stop-color="#d8e2fb"/>
      <stop offset="1" stop-color="#d9d4fb"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0effa"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8084f4"/>
      <stop offset="1" stop-color="#4c50cc"/>
    </linearGradient>
  </defs>
  <rect id="fondo-logo" width="512" height="512" rx="116" fill="url(#fondo)"/>
  <g id="dibujo" transform="translate(256 256) scale(1.1) translate(-256 -256)">
    <rect x="128" y="112" width="256" height="300" rx="50" fill="#5b5fd6" opacity=".14"/>
    <rect x="128" y="96" width="256" height="300" rx="50" fill="url(#cuerpo)"/>
    <rect x="156" y="270" width="200" height="98" rx="24" fill="#e9e8fc"/>
    <g stroke-linecap="round" stroke-width="24">
      <path d="M190 342v-44" stroke="#ec8a8b"/>
      <path d="M232 342v-26" stroke="#f1be44"/>
      <path d="M274 342v-8" stroke="#5fcb93"/>
      <path d="M316 342v-18" stroke="#f1be44"/>
    </g>
    <path d="M272 118 204 206h50l-10 52 68-88h-50z" fill="url(#rayo)" stroke="url(#rayo)" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
